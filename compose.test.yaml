# Postgres de teste local. Arrancar com: docker compose -f compose.test.yaml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: marketing_agent
      POSTGRES_PASSWORD: marketing_agent
      POSTGRES_DB: marketing_agent_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U marketing_agent -d marketing_agent_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
