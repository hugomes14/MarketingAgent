[project]
name = "marketing-agent"
version = "0.1.0"
description = "Marketing AI Manager: agente que planeia, executa e audita marketing com orcamento controlado."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "openai>=3.46.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
marketing-agent = "marketing_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# panel_rig/panel_fixtures sao partilhados pelos testes do painel e pelos ponta a ponta;
# content_rig, pelos testes do pipeline, do worker e dos ponta a ponta; planning_rig, pelos
# testes do plano semanal.
pythonpath = ["tests/panel", "tests/content", "tests/planning"]
addopts = "-ra --import-mode=importlib --strict-markers -m 'not live'"
markers = [
    "live: testes que chamam provedores reais (fora da execucao padrao)",
]
