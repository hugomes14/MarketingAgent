<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel{% endblock %} · Marketing AI Manager</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "historyCacheSize": 0, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body{% if csrf_token %} hx-headers='{{ {"X-CSRF-Token": csrf_token}|tojson }}'{% endif %}>
  <header class="topo">
    <a class="marca" href="/">Marketing AI Manager</a>
    {% if user %}
    <nav aria-label="Principal"><a href="/">Início</a> <a href="/lote">Lote semanal</a> <a href="/base">Base de conhecimento</a> <a href="/feedback">Feedback</a></nav>
    <span class="utilizador">{{ user.name or user.login }}</span>
    {% endif %}
  </header>
  <main>
    <div id="estado" class="estado" role="status" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/panel.js" defer></script>
</body>
</html>
