# Spec do Diretor ao produzir o diagnostico a partir do perfil de marca ativo.
# Valores monetarios SEMPRE como texto entre aspas (o carregador recusa numeros).
role: diretor
name: diagnostico
version: 1
loop_type: structured
prompt_file: prompt_diagnostico.md
output_schema: Diagnostico
required_capabilities: [text, json_schema]
tools: []
reads: [perfil_marca]
writes: [diagnostico]
validators: [diagnostico_factos_com_evidencia]
limits:
  max_steps: 4
  max_tokens: 80000
  max_cost_usd: "2.00"
  max_duration_s: 240
max_output_tokens: 6000
budget_share_hint: "0.30"
escalation: Sem saida valida ou limite atingido, o pedido de diagnostico falha e o responsavel pode repeti-lo.
