# Spec do percurso simples da avaliacao (2C): uma chamada devolve o texto e a escolha visual.
# Valores monetarios SEMPRE como texto entre aspas (o carregador recusa numeros).
# `writes: []`: o pacote e um valor devolvido ao chamador (um `eval_item`, nunca um post).
# Os validadores sao os do Copywriter e do Designer (`content.validation`, `content.visual`),
# aplicados pelo `extra_validator` do motor. Sem rota propria, usa a do Copywriter
# (`llm.router.ROUTE_FALLBACKS`): o mesmo modelo de base, para a comparacao ser justa.
# `max_steps` conta as chamadas de texto (ate 3 por saida invalida), a geracao do fundo e as
# repeticoes de rede.
role: simples
name: simples
version: 1
loop_type: structured
prompt_file: prompt.md
output_schema: PacoteSimples
required_capabilities: [text, json_schema]
tools: []
reads: [perfil_marca, estrategia, kb, kit_marca, biblioteca]
writes: []
validators: []
limits:
  max_steps: 4
  max_tokens: 60000
  max_cost_usd: "0.80"
  max_duration_s: 300
max_output_tokens: 2500
budget_share_hint: "0.30"
escalation: Sem pacote valido ou limite atingido, o pacote de avaliacao fica falhado com o motivo visivel.
