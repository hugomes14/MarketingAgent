# Postgres de DESENVOLVIMENTO local, com dados persistentes (volume nomeado, ao contrario do
# compose.test.yaml, que usa tmpfs). Arrancar com: docker compose -f compose.dev.yaml up -d
# Credenciais so de desenvolvimento e porta publicada apenas em loopback: nunca reutilizar
# estes valores nem expor esta base fora desta maquina.
# Nome de projeto proprio: sem ele, este ficheiro e o compose.test.yaml (mesma pasta) partilham o
# projeto e o servico `postgres`, e subir um substitui o contentor do outro.
name: marketing_agent_dev
services:
  postgres:
    image: postgres:17
    container_name: marketing_agent_dev_postgres
    environment:
      POSTGRES_USER: marketing_agent
      POSTGRES_PASSWORD: marketing_agent
      POSTGRES_DB: marketing_agent
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U marketing_agent -d marketing_agent"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - marketing_agent_dev_pgdata:/var/lib/postgresql/data

volumes:
  marketing_agent_dev_pgdata:
